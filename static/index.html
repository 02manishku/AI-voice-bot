<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Shubh · Magppie</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cg stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M9 13v6M16 8v16M23 14v4'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-sans-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-mono-400-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      /* ------------------------------------------------------------------
         A call console. White ground, black things — committed, not derived
         from the OS: this page does not follow prefers-color-scheme, so a
         machine set to dark still gets white paper. The only semantic the
         palette carries is who is talking — solid ink is Shubh, mid-grey is
         you. Structure comes from hairlines and type.
         ------------------------------------------------------------------ */
      :root {
        --paper:  #FFFFFF;
        --panel:  #FFFFFF;
        --ink:    #000000;
        --ink-2:  #5C5C5C;
        --ink-3:  #949494;
        --rule:   #DCDCDC;
        --rule-2: #ECECEC;
        --sans:   "IBM Plex Sans", system-ui, sans-serif;
        --mono:   "IBM Plex Mono", ui-monospace, monospace;
      }

      * { box-sizing: border-box; }
      /* A component's own `display` outranks the UA sheet's [hidden]. Put it back. */
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font: 400 15px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
        display: flex;
        justify-content: center;
        padding: 36px 22px 24px;
      }
      ::selection { background: var(--ink); color: var(--panel); }
      :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      .shell { width: 100%; max-width: 1180px; display: flex; flex-direction: column; gap: 12px; }

      /* ---- work row: mode sidebar + console ---- */
      .work { display: flex; align-items: flex-start; gap: 12px; }
      .work > .panel { flex: 1; min-width: 0; }
      .side { width: 244px; flex: none; display: flex; flex-direction: column; gap: 10px; }

      /* Two stacked, selectable mode cards. Selected = solid ink, like #begin. */
      .modes { display: flex; flex-direction: column; gap: 8px; }
      .mode {
        width: 100%; text-align: left; cursor: pointer;
        border: 1px solid var(--rule); border-radius: 12px; background: var(--panel);
        padding: 13px 14px; display: flex; flex-direction: column; gap: 5px;
        align-items: stretch; justify-content: flex-start;
        transition: border-color .14s ease, background .14s ease, color .14s ease;
      }
      .mode:hover:not([aria-pressed="true"]) { border-color: var(--ink-3); }
      .mode[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
      .mode .mode-t {
        font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
      }
      .mode .mode-d {
        font: 400 11.5px/1.4 var(--sans); letter-spacing: 0; text-transform: none;
        color: var(--ink-3);
      }
      .mode[aria-pressed="true"] .mode-d { color: #C9C9C9; }
      .mode:disabled { opacity: .5; cursor: default; }

      /* The fetched-lead card — who Shubh will call, and everything on their file. */
      .leadcard {
        border: 1px solid var(--rule); border-radius: 12px; background: var(--panel);
        padding: 13px 14px; display: flex; flex-direction: column; gap: 9px;
      }
      .leadcard .lc-h {
        font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
        color: var(--ink-3); display: flex; justify-content: space-between; align-items: center;
      }
      .leadcard .lc-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
      .leadcard .lc-name { font: 500 16px/1.15 var(--sans); letter-spacing: -.01em; color: var(--ink); }
      .leadcard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
      .leadcard dt {
        font: 400 10px/1.5 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3);
      }
      .leadcard dd { margin: 0; font-size: 12.5px; color: var(--ink-2); }
      .leadcard .lc-empty { font-size: 12px; color: var(--ink-3); line-height: 1.45; }

      /* Every uppercase label in this UI is mono. It is the console voice.
         Mono is already monospaced — wide tracking on top of that just pulls
         the words apart, so it stays low here and everywhere below. */
      .tag {
        font: 500 10px/1 var(--mono);
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      /* ---- masthead ---- */
      .top { display: flex; align-items: center; gap: 16px; }
      .top .mark { font: 500 11px/1 var(--mono); letter-spacing: .14em; color: var(--ink); }
      .top .rule { flex: 1; height: 1px; background: var(--rule); }
      .net { display: inline-flex; align-items: center; gap: 8px; }
      .net i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); }
      .net[data-ok="yes"] i { background: var(--ink); }
      .net[data-ok="no"] i {
        background: var(--ink);
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      /* ---- panel ----
         overflow:hidden so the full-width inner rules get clipped by the
         radius instead of poking out past the rounded corners. */
      .panel {
        border: 1px solid var(--rule); background: var(--panel);
        border-radius: 14px; overflow: hidden;
      }

      .ident {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--rule);
      }
      .ident h1 {
        margin: 0; font: 500 19px/1.2 var(--sans); letter-spacing: -.02em;
        display: inline-flex; align-items: baseline; gap: 12px;
      }
      .ident h1 span { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
      #state { color: var(--ink-3); }
      #state[data-phase="live"] { color: var(--ink-2); }
      #state[data-phase="talk"] { color: var(--ink); }

      /* ---- the trace: the hero. A call is audio over time, so the page
             leads with audio over time. ---- */
      /* One 22px margin governs the legend, the canvas, the clock and the log,
         so the trace's left edge lands on the same line as everything under it. */
      .trace { border-bottom: 1px solid var(--rule); padding: 11px 22px 9px; }
      .trace .legend { display: flex; align-items: center; gap: 18px; }
      .trace .legend .key { display: inline-flex; align-items: center; gap: 7px; }
      .trace .legend .key b { width: 8px; height: 8px; border-radius: 50%; }
      .key.shubh b { background: var(--ink); }
      .key.you b { background: var(--ink-2); }
      .trace canvas { display: block; width: 100%; height: 168px; }

      /* ---- transport + log ---- */
      .grid { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
      .rail { padding: 20px 22px 22px; border-right: 1px solid var(--rule); }
      .clock {
        font: 400 34px/1 var(--mono); letter-spacing: -.02em;
        font-variant-numeric: tabular-nums; color: var(--ink);
      }
      .clock[data-idle="yes"] { color: var(--ink-3); }
      .controls { margin-top: 18px; }
      button {
        width: 100%; cursor: pointer; border: 1px solid var(--ink);
        border-radius: 9px; padding: 12px 14px;
        display: inline-flex; align-items: center; justify-content: center; gap: 9px;
        font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
        transition: background .14s ease, color .14s ease, opacity .14s ease;
      }
      button svg {
        width: 15px; height: 15px; flex: none;
        fill: none; stroke: currentColor; stroke-width: 1.7;
        stroke-linecap: round; stroke-linejoin: round;
      }
      button svg.down { transform: rotate(134deg); }
      #begin { background: var(--ink); color: var(--panel); }
      #begin:hover:not(:disabled) { opacity: .78; }
      #end { background: transparent; color: var(--ink); }
      #end:hover { background: var(--ink); color: var(--panel); }
      button:disabled { opacity: .3; cursor: default; }
      .hint { margin: 14px 0 0; font-size: 12px; line-height: 1.45; color: var(--ink-3); }

      .log { display: flex; flex-direction: column; min-height: 0; }
      .log-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 14px 22px; border-bottom: 1px solid var(--rule);
      }
      .feed { overflow-y: auto; padding: 0 22px; max-height: 336px; scrollbar-width: thin; }
      .empty { color: var(--ink-3); font-size: 13px; margin: 20px 0; }

      .turn { padding: 15px 0; border-bottom: 1px solid var(--rule-2); }
      .turn:last-child { border-bottom: 0; }
      .turn .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
      /* The transcript keys back to the trace: the swatch beside each speaker is
         the exact grey their audio is drawn in above. */
      .turn .head::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .turn.bot .head::before { background: var(--ink); }
      .turn.you .head::before { background: var(--ink-2); }
      .turn .at { font: 400 10px/1 var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
      /* The one place leading stays generous: Shubh answers in Hindi, and
         Devanagari hangs matras above and below the line that a tight measure
         would collide with. */
      .turn .said { margin: 0; max-width: 62ch; color: var(--ink-2); font-size: 14px; line-height: 1.55; }
      .turn.bot .said { color: var(--ink); font-size: 14.5px; }
      .turn .said.waiting { color: var(--ink-3); }
      .cites, .tel {
        margin-top: 7px; font: 400 10px/1.4 var(--mono);
        letter-spacing: 0; color: var(--ink-3);
      }
      .tel { font-variant-numeric: tabular-nums; }

      #error {
        padding: 11px 14px; border: 1px solid var(--ink); border-radius: 9px;
        font: 400 12px/1.5 var(--mono); white-space: pre-wrap;
        background: var(--ink); color: var(--panel);
      }

      footer { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
      footer a { color: var(--ink-3); text-decoration: none; border-bottom: 1px solid var(--rule); }
      footer a:hover { color: var(--ink); border-bottom-color: var(--ink); }

      @media (max-width: 820px) {
        body { padding: 20px 14px; }
        .work { flex-direction: column; }
        .side { width: 100%; }
        .modes { flex-direction: row; }
        .modes .mode { flex: 1; }
        .grid { grid-template-columns: 1fr; }
        .rail { border-right: 0; border-bottom: 1px solid var(--rule); }
        .trace canvas { height: 132px; }
        .feed { max-height: 46vh; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <span class="mark">MAGPPIE</span>
        <span class="rule"></span>
        <span class="net tag" id="net"><i></i><span id="netLabel">checking</span></span>
      </header>

      <div class="work">
        <aside class="side">
          <div class="modes" role="group" aria-label="Call mode">
            <button class="mode" id="modeLead" data-mode="lead" aria-pressed="true">
              <span class="mode-t">Lead Call</span>
              <span class="mode-d">Live from Zoho — Shubh calls the freshest lead by name and knows their file</span>
            </button>
            <button class="mode" id="modeAssistant" data-mode="assistant" aria-pressed="false">
              <span class="mode-t">Assistant</span>
              <span class="mode-d">General enquiry — answers like a help desk, no CRM</span>
            </button>
          </div>
          <div class="leadcard" id="leadcard" hidden>
            <div class="lc-h"><span>Next call</span><span class="lc-dot"></span></div>
            <div class="lc-name" id="lcName">—</div>
            <dl id="lcFacts"></dl>
            <div class="lc-empty" id="lcEmpty" hidden></div>
          </div>
        </aside>

        <main class="panel">
        <div class="ident">
          <h1>Shubh <span>Wellness Consultant</span></h1>
          <span class="tag" id="state" data-phase="off" role="status" aria-live="polite">Not connected</span>
        </div>

        <div class="trace">
          <div class="legend">
            <span class="key shubh tag"><b></b>Shubh</span>
            <span class="key you tag"><b></b>You</span>
          </div>
          <canvas id="scope" aria-hidden="true"></canvas>
        </div>

        <div class="grid">
          <div class="rail">
            <div class="clock" id="clock" data-idle="yes">00:00</div>
            <div class="controls">
              <button id="begin">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 10.6c1.3 2.7 3.5 4.9 6.2 6.2l2.1-2.1c.3-.3.7-.4 1-.2 1.1.4 2.2.6 3.4.6.6 0 1 .4 1 1v3.3c0 .6-.4 1-1 1C10.9 20.4 3.6 13.1 3.6 4.1c0-.6.4-1 1-1h3.3c.6 0 1 .4 1 1 0 1.2.2 2.3.6 3.4.1.4 0 .7-.2 1l-2.1 2.1z"/></svg>
                Call Shubh
              </button>
              <button id="end" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true" class="down"><path d="M7.2 10.6c1.3 2.7 3.5 4.9 6.2 6.2l2.1-2.1c.3-.3.7-.4 1-.2 1.1.4 2.2.6 3.4.6.6 0 1 .4 1 1v3.3c0 .6-.4 1-1 1C10.9 20.4 3.6 13.1 3.6 4.1c0-.6.4-1 1-1h3.3c.6 0 1 .4 1 1 0 1.2.2 2.3.6 3.4.1.4 0 .7-.2 1l-2.1 2.1z"/></svg>
                End call
              </button>
            </div>
            <p class="hint" id="hint">Speak once the line opens, then pause. Shubh takes it from there.</p>
          </div>

          <div class="log">
            <div class="log-head">
              <span class="tag">Transcript</span>
              <span class="tag" id="count"></span>
            </div>
            <div class="feed" id="feed">
              <p class="empty">Nothing yet. The call will write itself down here.</p>
            </div>
          </div>
        </div>
        </main>
      </div>

      <div id="error" hidden></div>

      <footer class="tag">
        <span id="kbStat">—</span>
        <a href="/api/kb/debug">kb</a>
        <a href="/api/health">health</a>
        <a href="/api/debug/last-upload.wav">last upload</a>
      </footer>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
