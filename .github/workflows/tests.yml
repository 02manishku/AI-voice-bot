name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-suites:
    name: offline suites
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      # Every test_*.py suite stubs Sarvam and OpenAI, so this needs no API keys
      # and spends no credits. Each file exits non-zero on failure.
      - name: Run the offline test suites
        run: |
          failed=""
          for f in tests/test_*.py; do
            echo "::group::$f"
            if uv run python "$f"; then
              echo "PASS $f"
            else
              failed="$failed $f"
              echo "FAIL $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failing suites:$failed"
            exit 1
          fi
          echo "All offline suites passed."
