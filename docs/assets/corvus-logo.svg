<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Corvus">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#tile)"/>
  <rect width="128" height="128" rx="30" fill="url(#sheen)"/>

  <!-- voice waveform: the agent speaking and listening -->
  <g fill="#FFFFFF">
    <rect x="28"  y="54" width="9" height="20" rx="4.5" opacity="0.70"/>
    <rect x="43"  y="42" width="9" height="44" rx="4.5" opacity="0.85"/>
    <rect x="58"  y="30" width="9" height="68" rx="4.5"/>
    <rect x="73"  y="42" width="9" height="44" rx="4.5" opacity="0.85"/>
    <rect x="88"  y="54" width="9" height="20" rx="4.5" opacity="0.70"/>
  </g>
</svg>
